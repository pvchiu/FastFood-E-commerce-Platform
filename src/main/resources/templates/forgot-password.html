<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="fragments/layout :: head">
   <title>Forgot Password - FastFood App</title>
</head>

<body class="bg-light">
   <div class="container">
      <div class="row justify-content-center mt-5">
         <div class="col-md-6 col-lg-4">
            <div class="card shadow">
               <div class="card-body p-4">
                  <div class="text-center mb-4">
                     <i class="fas fa-key text-warning" style="font-size: 3rem;"></i>
                     <h3 class="mt-2">Forgot Password</h3>
                     <p class="text-muted">Enter your email to reset your password</p>
                  </div>

                  <!-- Success Message -->
                  <div th:if="${param.sent}" class="alert alert-success">
                     <i class="fas fa-check-circle me-2"></i>
                     A reset link has been sent to your email!
                  </div>

                  <!-- Error Message -->
                  <div th:if="${param.error}" class="alert alert-danger">
                     <i class="fas fa-exclamation-circle me-2"></i>
                     Email not found in our system!
                  </div>

                  <!-- Forgot Password Form -->
                  <form th:action="@{/forgot-password}" method="post" id="forgotPasswordForm">
                     <div class="mb-3">
                        <label for="email" class="form-label">
                           <i class="fas fa-envelope me-1"></i>Email
                        </label>
                        <input type="email" class="form-control" id="email" name="email"
                           placeholder="Enter your email address" required>
                        <div class="form-text">
                           We will send a password reset link to this email
                        </div>
                     </div>

                     <button type="submit" class="btn btn-warning w-100 mb-3">
                        <i class="fas fa-paper-plane me-2"></i>Send Reset Link
                     </button>
                  </form>

                  <div class="text-center">
                     <a th:href="@{/login}" class="text-decoration-none text-primary">
                        <i class="fas fa-arrow-left me-1"></i>Back to Login
                     </a>
                  </div>

                  <hr class="my-3">

                  <div class="text-center">
                     <span class="text-muted">Don't have an account? </span>
                     <a th:href="@{/register}" class="text-decoration-none text-primary">
                        <i class="fas fa-user-plus me-1"></i>Register now
                     </a>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>

   <!-- Scripts -->
   <div th:replace="fragments/layout :: scripts"></div>

   <script>
      // Form validation and submission
      document.getElementById('forgotPasswordForm').addEventListener('submit', function(e) {
         const email = document.getElementById('email').value;

         if (!email) {
            e.preventDefault();
            alert('Please enter your email address!');
            return;
         }

         // Email validation
         const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
         if (!emailRegex.test(email)) {
            e.preventDefault();
            alert('Please enter a valid email address!');
            return;
         }

         // Show loading state
         const submitBtn = e.target.querySelector('button[type="submit"]');
         submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Sending...';
         submitBtn.disabled = true;
      });
   </script>
</body>

</html>
