<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/layout :: head">
  <title>Review Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
  <div th:replace="~{fragments/layout :: navbar}"></div>

  <div class="container mt-4">
    <h2 class="mb-4">Review Products from Order #[[${order.orderNumber}]]</h2>

    <div class="row">
      <div class="col-md-8">
        <!-- Hiển thị từng sản phẩm trong order để review -->
        <div th:each="item : ${items}" class="card mb-3">
          <div class="card-body">
            <div class="row">
              <div class="col-md-3">
                <img th:src="@{'/' + ${item.product.imageUrl}}" alt="Product" class="img-fluid rounded"
                  style="max-height: 150px; object-fit: cover;">
              </div>
              <div class="col-md-9">
                <h5 class="card-title" th:text="${item.product.name}">Product Name</h5>
                <p class="text-muted">
                  Quantity: <span th:text="${item.quantity}">1</span> |
                  Price: $<span th:text="${item.unitPrice}">0.00</span>
                </p>

                <form th:action="@{/orders/reviews/submit}" method="post" class="mt-3">
                  <input type="hidden" name="orderId" th:value="${order.id}" />
                  <input type="hidden" name="productId" th:value="${item.product.id}" />

                  <div class="mb-3">
                    <label for="rating" class="form-label">Rating:</label>
                    <select name="rating" id="rating" class="form-select" required>
                      <option value="">Chọn rating</option>
                      <option value="5">⭐⭐⭐⭐⭐ (5 stars - Excellent)</option>
                      <option value="4">⭐⭐⭐⭐ (4 stars - Very Good)</option>
                      <option value="3">⭐⭐⭐ (3 stars - Good)</option>
                      <option value="2">⭐⭐ (2 stars - Fair)</option>
                      <option value="1">⭐ (1 star - Poor)</option>
                    </select>
                  </div>

                  <div class="mb-3">
                    <label for="comment" class="form-label">Comment:</label>
                    <textarea name="comment" id="comment" class="form-control" rows="3"
                      placeholder="Share your experience with this product..." required></textarea>
                  </div>

                  <button type="submit" class="btn btn-primary">
                    <i class="fas fa-star me-2"></i>Submit Review
                  </button>
                </form>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-4">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Order Summary</h5>
          </div>
          <div class="card-body">
            <p><strong>Order Number:</strong> <span th:text="${order.orderNumber}">ORD-001</span></p>
            <p><strong>Total Amount:</strong> $<span th:text="${order.totalAmount}">0.00</span></p>
            <p><strong>Status:</strong> <span th:text="${order.status}" class="badge bg-info">PENDING</span></p>
            <p><strong>Delivery Address:</strong> <span th:text="${order.deliveryAddress}">Address</span></p>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <a th:href="@{/orders}" class="btn btn-secondary">
        <i class="fas fa-arrow-left me-2"></i>Back to Orders
      </a>
    </div>
  </div>

  <div th:replace="~{fragments/layout :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
