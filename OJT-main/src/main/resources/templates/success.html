<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head th:replace="fragments/layout :: head">
    <title>Order Success</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <!-- Navigation -->
    <nav th:replace="fragments/layout :: navbar"></nav>

    <div class="container mt-5">
      <h2 class="text-success">🎉 Order Placed Successfully!</h2>
      <p>
        <strong>Order Number:</strong>
        <span th:text="${order.orderNumber}"></span>
      </p>
      <p>
        <strong>Delivery Address:</strong>
        <span th:text="${order.deliveryAddress}"></span>
      </p>
      <p>
        <strong>Notes:</strong> <span th:text="${order.notes} ?: 'N/A'"></span>
      </p>
      <p>
        <strong>Payment Method:</strong>
        <span th:text="${order.paymentMethod}"></span>
      </p>
      <p>
        <strong>Total:</strong> $<span th:text="${order.totalAmount}"></span>
      </p>
      <p>
        <strong>Order Date:</strong>
        <span
          th:text="${#temporals.format(order.createdAt, 'dd/MM/yyyy HH:mm')}"
        ></span>
      </p>

      <h4 class="mt-4">🧾 Items:</h4>
      <table class="table table-bordered">
        <thead>
          <tr>
            <th>Product</th>
            <th>Qty</th>
            <th>Price</th>
            <th>Subtotal</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="item : ${items}">
            <td th:text="${item.product.name}"></td>
            <td th:text="${item.quantity}"></td>
            <td th:text="${item.unitPrice}"></td>
            <td th:text="${item.subtotal}"></td>
          </tr>
        </tbody>
      </table>

      <!-- <a href="/" class="btn btn-primary mt-3">🏠 Back to Home</a> -->
    </div>
    <!-- Footer -->
    <footer th:replace="fragments/layout :: footer"></footer>

    <!-- Scripts -->
    <div th:replace="fragments/layout :: scripts"></div>
  </body>
</html>
