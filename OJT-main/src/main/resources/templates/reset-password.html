<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head th:replace="fragments/layout :: head">
   <title>Reset Password - FastFood App</title>
   <style>
      /* Password toggle button styling */
      .input-group .btn-outline-secondary {
         border-color: #ced4da;
         color: #6c757d;
      }
      
      .input-group .btn-outline-secondary:hover {
         background-color: #f8f9fa;
         border-color: #adb5bd;
         color: #495057;
      }
      
      .input-group .btn-outline-secondary:focus {
         box-shadow: 0 0 0 0.2rem rgba(108, 117, 125, 0.25);
      }
      
      /* Ensure input and button have same height */
      .input-group .form-control,
      .input-group .btn {
         border-radius: 0.375rem;
      }
      
      .input-group .form-control {
         border-top-right-radius: 0;
         border-bottom-right-radius: 0;
      }
      
      .input-group .btn {
         border-top-left-radius: 0;
         border-bottom-left-radius: 0;
      }
   </style>
</head>

<body class="bg-light">
   <div class="container">
      <div class="row justify-content-center mt-5">
         <div class="col-md-6 col-lg-4">
            <div class="card shadow">
               <div class="card-body p-4">
                  <div class="text-center mb-4">
                     <i class="fas fa-lock text-danger" style="font-size: 3rem;"></i>
                     <h3 class="mt-2">Reset Password</h3>
                     <p class="text-muted">Enter your new password below</p>
                  </div>

                  <!-- Success Message -->
                  <div th:if="${param.resetSuccess}" class="alert alert-success">
                     <i class="fas fa-check-circle me-2"></i>
                     Your password has been successfully reset!
                  </div>

                  <!-- Error Message -->
                  <div th:if="${param.resetError}" class="alert alert-danger">
                     <i class="fas fa-exclamation-circle me-2"></i>
                     Invalid or expired reset token!
                  </div>

                  <!-- Reset Password Form -->
                  <form th:action="@{/reset-password}" method="post" id="resetPasswordForm">
                     <input type="hidden" name="token" th:value="${token}" />

                     <div class="mb-3">
                        <label for="newPassword" class="form-label">
                           <i class="fas fa-lock me-1"></i>New Password
                        </label>
                        <div class="input-group">
                           <input type="password" class="form-control" id="newPassword" name="newPassword"
                              placeholder="Enter new password" required minlength="6">
                           <button class="btn btn-outline-secondary" type="button" id="toggleNewPassword">
                              <i class="fas fa-eye" id="newPasswordToggleIcon"></i>
                           </button>
                        </div>
                     </div>

                     <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                           <i class="fas fa-lock me-1"></i>Confirm Password
                        </label>
                        <div class="input-group">
                           <input type="password" class="form-control" id="confirmPassword" name="confirmPassword"
                              placeholder="Confirm new password" required minlength="6">
                           <button class="btn btn-outline-secondary" type="button" id="toggleConfirmPassword">
                              <i class="fas fa-eye" id="confirmPasswordToggleIcon"></i>
                           </button>
                        </div>
                     </div>

                     <button type="submit" class="btn btn-danger w-100 mb-3">
                        <i class="fas fa-redo me-2"></i>Reset Password
                     </button>
                  </form>

                  <div class="text-center">
                     <a th:href="@{/login}" class="text-decoration-none text-primary">
                        <i class="fas fa-arrow-left me-1"></i>Back to Login
                     </a>
                  </div>
               </div>
            </div>
         </div>
      </div>
   </div>

   <!-- Scripts -->
   <div th:replace="fragments/layout :: scripts"></div>
   <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

   <script>
   document.getElementById('resetPasswordForm').addEventListener('submit', function (e) {
      const password = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      const strengthRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}$/;

      if (!password || !confirmPassword) {
         e.preventDefault();
         Swal.fire({
            icon: 'warning',
            title: 'Missing Information',
            text: 'Please fill in all password fields.'
         });
         return;
      }

      if (!strengthRegex.test(password)) {
         e.preventDefault();
         Swal.fire({
            icon: 'error',
            title: 'Weak Password',
            html: 'Password must be at least <b>8 characters</b> long and contain <b>uppercase</b>, <b>lowercase</b>, and a <b>number</b>.'
         });
         return;
      }

      if (password !== confirmPassword) {
         e.preventDefault();
         Swal.fire({
            icon: 'error',
            title: 'Password Mismatch',
            text: 'Passwords do not match. Please try again.'
         });
         return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin me-2"></i>Resetting...';
      submitBtn.disabled = true;
   });

   // Password Toggle Functionality
   document.addEventListener('DOMContentLoaded', function() {
      // Toggle New Password
      const toggleNewPassword = document.getElementById('toggleNewPassword');
      const newPasswordInput = document.getElementById('newPassword');
      const newPasswordToggleIcon = document.getElementById('newPasswordToggleIcon');

      toggleNewPassword.addEventListener('click', function() {
         if (newPasswordInput.type === 'password') {
            newPasswordInput.type = 'text';
            newPasswordToggleIcon.className = 'fas fa-eye-slash';
            toggleNewPassword.setAttribute('title', 'Hide password');
         } else {
            newPasswordInput.type = 'password';
            newPasswordToggleIcon.className = 'fas fa-eye';
            toggleNewPassword.setAttribute('title', 'Show password');
         }
      });

      // Toggle Confirm Password
      const toggleConfirmPassword = document.getElementById('toggleConfirmPassword');
      const confirmPasswordInput = document.getElementById('confirmPassword');
      const confirmPasswordToggleIcon = document.getElementById('confirmPasswordToggleIcon');

      toggleConfirmPassword.addEventListener('click', function() {
         if (confirmPasswordInput.type === 'password') {
            confirmPasswordInput.type = 'text';
            confirmPasswordToggleIcon.className = 'fas fa-eye-slash';
            toggleConfirmPassword.setAttribute('title', 'Hide password');
         } else {
            confirmPasswordInput.type = 'password';
            confirmPasswordToggleIcon.className = 'fas fa-eye';
            toggleConfirmPassword.setAttribute('title', 'Show password');
         }
      });

      // Set initial tooltips
      toggleNewPassword.setAttribute('title', 'Show password');
      toggleConfirmPassword.setAttribute('title', 'Show password');
   });
</script>

</body>

</html>
