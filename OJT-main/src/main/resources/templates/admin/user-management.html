<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>User Management - Admin</title>
    <link rel="icon" href="/images/b.png" type="image/png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link th:href="@{/css/style.css}" rel="stylesheet" />
    <style>
      :root {
        --primary-color: #2563eb;
        --secondary-color: #64748b;
        --success-color: #059669;
        --danger-color: #dc2626;
        --background-color: #f8fafc;
        --card-bg: #ffffff;
        --text-primary: #1e293b;
        --text-secondary: #64748b;
        --border-color: #e2e8f0;
        --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
        --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--background-color);
        color: var(--text-primary);
      }

      .admin-container {
        max-width: 1400px;
        margin: 2rem auto;
        padding: 0 2rem 2rem;
      }

      .admin-header {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 2rem;
        margin-bottom: 2rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
      }

      .admin-title {
        font-size: 2rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .main-content {
        background: var(--card-bg);
        border-radius: 12px;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        overflow: hidden;
      }

      .content-header {
        padding: 2rem;
        border-bottom: 1px solid var(--border-color);
        background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
      }

      .search-section {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
      }

      .search-input,
      .status-dropdown {
        padding: 0.75rem 1rem;
        border-radius: 8px;
        border: 2px solid var(--border-color);
        font-size: 1rem;
        transition: border-color 0.2s;
      }

      .search-input:focus,
      .status-dropdown:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgb(37 99 235 / 0.1);
      }

      .btn-modern {
        padding: 0.6rem 1.2rem;
        border-radius: 8px;
        font-weight: 600;
        font-size: 0.9rem;
        text-transform: uppercase;
        border: none;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .btn-success {
        background: var(--success-color);
        color: white;
      }
      .btn-danger {
        background: var(--danger-color);
        color: white;
      }
      .btn-success:hover,
      .btn-danger:hover {
        box-shadow: var(--shadow-md);
        transform: translateY(-1px);
      }

      .modern-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
      }

      .modern-table thead th {
        padding: 1rem;
        background: #f8fafc;
        font-size: 0.875rem;
        text-transform: uppercase;
        color: var(--text-secondary);
        border-bottom: 2px solid var(--border-color);
        text-align: left;
      }

      .modern-table tbody td {
        padding: 1rem;
        border-bottom: 1px solid #f1f5f9;
      }

      .status-active {
        color: var(--success-color);
        font-weight: 600;
      }

      .status-inactive {
        color: var(--danger-color);
        font-weight: 600;
      }

      @media (max-width: 768px) {
        .search-section {
          flex-direction: column;
        }
      }
      .admin-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }
      .stat-card {
        background: var(--card-bg);
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: var(--shadow-sm);
        border: 1px solid var(--border-color);
        transition: all 0.2s ease;
      }
      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        margin: 0;
      }
      .stat-label {
        color: var(--text-secondary);
        font-size: 0.875rem;
        margin: 0;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .status-pill {
        display: inline-block;
        font-size: 14px;
        font-weight: 600;
        padding: 10px 16px;
        border-radius: 8px;
        min-width: 120px;
        height: 42px;
        text-align: center;
        vertical-align: middle;
        text-transform: uppercase;
      }

      .status-pill.active {
        background-color: #d1fae5;
        color: var(--success-color);
      }

      .status-pill.inactive {
        background-color: #fee2e2;
        color: var(--danger-color);
      }

      .btn-toggle-status {
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        min-width: 120px;
        height: 42px;
        text-align: center;
        text-transform: uppercase;
        cursor: pointer;
      }

      .btn-toggle-status.activate {
        background-color: var(--success-color);
        color: white;
      }

      .btn-toggle-status.deactivate {
        background-color: var(--danger-color);
        color: white;
      }
    </style>
  </head>

  <body>
    <div th:replace="~{fragments/layout :: navbar}"></div>

    <div class="admin-container">
      <div class="admin-header">
        <h1 class="admin-title">
          <i class="fas fa-users"></i> User Management
        </h1>
      </div>
      <div class="admin-stats">
        <div class="stat-card">
          <p
            class="stat-value"
            style="color: var(--primary-color)"
            th:text="${totalUsers}"
          >
            0
          </p>
          <p class="stat-label">Total Users</p>
        </div>
        <div class="stat-card">
          <p
            class="stat-value"
            style="color: var(--success-color)"
            th:text="${activeUsers}"
          >
            0
          </p>
          <p class="stat-label">Active Users</p>
        </div>
        <div class="stat-card">
          <p
            class="stat-value"
            style="color: var(--danger-color)"
            th:text="${inactiveUsers}"
          >
            0
          </p>
          <p class="stat-label">Deactive Users</p>
        </div>
      </div>

      <div class="main-content">
        <div class="content-header">
          <form
            method="get"
            th:action="@{/admin/user-management}"
            class="search-section"
          >
            <input
              type="text"
              name="keyword"
              class="search-input"
              placeholder="Search by name..."
              th:value="${keyword != null ? keyword : ''}"
            />

            <select name="status" class="status-dropdown">
              <option value="" th:selected="${status == null or status == ''}">
                All
              </option>
              <option
                th:each="s : ${statuses}"
                th:value="${s.name()}"
                th:text="${s.name()}"
                th:selected="${status == s.name()}"
              ></option>
            </select>

            <button type="submit" class="btn-modern btn-success">
              <i class="fas fa-search"></i> Search
            </button>
          </form>
        </div>

        <div>
          <table class="modern-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Status</th>
                <th>Toggle</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.fullName}">John Doe</td>
                <td th:text="${user.email}">john@example.com</td>
                <td>
                  <span
                    th:text="${user.status.name()}"
                    th:classappend="${user.status.name() == 'ACTIVE'} ? 'status-active' : 'status-inactive'"
                    style="display: flex; align-items: center; font-size:14px; font-weight:600; padding:10px ; padding-left:0px; border-radius:8px; min-width:120px; height:42px; text-transform:uppercase;"
                  >
                  </span>
                </td>
                <td>
                  <form
                    th:action="@{'/admin/users/toggle/' + ${user.id}}"
                    method="post"
                    th:object="${user}"
                  >
                    <button
                      type="submit"
                      class="btn-modern"
                      th:classappend="${user.status.name() == 'ACTIVE'} ? 'btn-danger' : 'btn-success'"
                      th:text="${user.status.name() == 'ACTIVE'} ? 'Deactivate' : 'Activate'"
                      style="padding:10px 16px; font-size:14px; font-weight:600; border:none; border-radius:8px;  min-width:120px; height:42px; text-align:center; text-transform:uppercase; cursor:pointer;"
                    ></button>
                  </form>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div th:replace="~{fragments/layout :: footer}"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
