<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
   <meta charset="UTF-8">
   <title>Product Detail Test</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
   <div class="container mt-4">
      <h1>Product Detail Test</h1>
      <div class="card">
         <div class="card-body">
            <h5 class="card-title" th:text="${product?.name} ?: 'Unknown Product'">Product Name</h5>
            <p class="card-text" th:text="${product?.description} ?: 'No description'">Product Description</p>
            <p class="text-muted">Price: $<span th:text="${product?.price} ?: '0.00'">0.00</span></p>

            <!-- Basic Review Info -->
            <div class="mt-3">
               <h6>Reviews</h6>
               <p>Total Reviews: <span th:text="${reviewCount} ?: 0">0</span></p>
               <p>Average Rating: <span th:text="${averageRating} ?: 0">0</span></p>
               <p>Is Authenticated: <span th:text="${isAuthenticated} ?: false">false</span></p>
               <p>Has Reviewed: <span th:text="${hasReviewed} ?: false">false</span></p>
            </div>

            <!-- Simple review form for authenticated users -->
            <div th:if="${isAuthenticated and !hasReviewed}" class="mt-4">
               <h6>Write a Review</h6>
               <form th:action="@{'/products/' + ${product.id} + '/reviews'}" method="post">
                  <div class="mb-3">
                     <label for="rating" class="form-label">Rating</label>
                     <select name="rating" id="rating" class="form-select" required>
                        <option value="">Choose rating</option>
                        <option value="5">5 stars</option>
                        <option value="4">4 stars</option>
                        <option value="3">3 stars</option>
                        <option value="2">2 stars</option>
                        <option value="1">1 star</option>
                     </select>
                  </div>
                  <div class="mb-3">
                     <label for="comment" class="form-label">Comment</label>
                     <textarea name="comment" id="comment" class="form-control" rows="3" required></textarea>
                  </div>
                  <button type="submit" class="btn btn-primary">Submit Review</button>
               </form>
            </div>

            <!-- Login prompt -->
            <div th:unless="${isAuthenticated}" class="mt-4">
               <p>Please <a th:href="@{/login}">login</a> to write a review.</p>
            </div>

            <!-- Already reviewed message -->
            <div th:if="${isAuthenticated and hasReviewed}" class="mt-4 alert alert-info">
               You have already reviewed this product.
            </div>
         </div>
      </div>
   </div>
</body>

</html>
